name = "red-bird-09b0"
compatibility_date = "2026-06-30"
main = "src/index.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Buyer list form (src/buyer-intake.js). The Turnstile site key is public by design:
# it is printed into every visitor's page. Empty means the form shows no bot check.
# Secrets for the same feature (HELMIQ_INTAKE_URL, HELMIQ_SIGNING_SECRET,
# TURNSTILE_SECRET_KEY, IP_HASH_SALT) are set with `wrangler secret put`, never here.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFeSRy26Y1vZBhoy"

# Three sign-up attempts per visitor per minute. Cloudflare counts per location,
# so this is a brake on a script hammering the form, not an exact quota.
[[ratelimits]]
name = "BUYER_LIST_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
