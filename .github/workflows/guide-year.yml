# The guide URLs carry a year, so once a year every one of them starts lying.
# Nothing in a diff shows that. The site stays perfectly self-consistent while
# 27 guides advertise a year that has already passed, every test passes, and the
# only signal is a warning printed inside a green build, which is to say no
# signal at all.
#
# So the reminder runs on a clock and speaks up where someone will see it. It is
# deliberately not part of checks.yml: failing every push from January 1st until
# the editorial work is done would block unrelated fixes and teach everyone to
# ignore the checker, which is the exact failure check_site.py's own comment
# warns about. This blocks nothing, so it is free to be loud.
name: guide-year

on:
  schedule:
    # Mondays, just after the link-rot job. Silent 51 weeks of the year: it only
    # has anything to say once the calendar has moved past CURRENT_GUIDE_YEAR.
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guide-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # --strict-year promotes the stale-year warning to an error. Errors print
      # to stderr, so both streams are captured or the report arrives empty.
      - name: Check the guide year against the calendar
        id: check
        run: |
          set +e
          python3 tools/check_site.py --strict-year 2>&1 | tee /tmp/guide-year-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/guide-year-report.txt', 'utf8').trim();
            const title = 'Roll the guide year';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The calendar has moved past `CURRENT_GUIDE_YEAR` in `src/index.js`, so the guide URLs',
              'and titles are advertising a year that has passed.',
              '',
              'Rolling it is one constant and a rename per guide. Old links keep working either way:',
              'the Worker resolves any year form onto the current one in a single hop, so nothing',
              'breaks while this sits open. It just reads as stale to anyone who lands on it.',
              '',
              'Steps:',
              '1. Refresh the content that is genuinely year-specific.',
              '2. Rename `articles/<slug>-<old>.html` to `articles/<slug>-<new>.html`.',
              '3. Bump `CURRENT_GUIDE_YEAR` in `src/index.js`.',
              '4. Run `python3 tools/build_related.py` and `python3 tools/build_feed.py` to refresh',
              '   the sitemap, the feed and the Keep Reading blocks.',
              '',
              'If this run failed for some other reason, the full report below says which check it was.',
              '',
              '```',
              report,
              '```',
              '',
              `Reproduce locally with \`python3 tools/check_site.py --strict-year\`. [Workflow run](${run})`,
            ].join('\n');

            // Matched on title rather than a label, mirroring link-check.yml, so
            // this needs no label to exist beforehand.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.data.find(
              (issue) => issue.title === title && !issue.pull_request
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail the run when the guide year is stale
        if: steps.check.outputs.status != '0'
        run: exit 1
